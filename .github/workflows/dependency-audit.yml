name: Dependency audit

on:
  pull_request:
  push:
    branches:
      - dev
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nine_to_shine_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nine_to_shine_frontend/package-lock.json
      - run: npm ci
      - name: Audit npm dependencies
        shell: bash
        run: |
          npm audit --audit-level=none --json | tee npm-audit.json
          vulnerabilities=$(jq -er '.metadata.vulnerabilities.total | select(type == "number" and . >= 0 and floor == .)' npm-audit.json)
          if [ "$vulnerabilities" -gt 0 ]; then
            echo "::warning title=npm dependency audit::Found $vulnerabilities vulnerable packages. See this step's logs for details."
          fi

  nuget:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nine_to_shine_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore NineToShineApi.sln
      - name: Audit NuGet dependencies
        shell: bash
        run: |
          dotnet list NineToShineApi.sln package --vulnerable --include-transitive --format json | tee nuget-audit.json
          vulnerabilities=$(jq '[.projects[] | .frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?)] | length' nuget-audit.json)
          if [ "$vulnerabilities" -gt 0 ]; then
            echo "::warning title=NuGet dependency audit::Found $vulnerabilities vulnerable package entries. See this step's logs for details."
          fi
